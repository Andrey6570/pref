# Сборка APK и публикация релиза v<версия из app.json>.
# Запускается, когда в main меняется версия приложения (app.json), при пуше тега v* или вручную из Actions.
# Если релиз с такой версией уже есть, APK только собирается (артефакт запуска).
name: Android APK

on:
  push:
    branches: [main]
    paths: ['apps/mobile/app.json', '.github/workflows/android-release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Преферанс ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          files: dist/*.apk
          body_path: RELEASE_NOTES.md
